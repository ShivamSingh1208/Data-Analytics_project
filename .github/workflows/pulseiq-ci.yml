name: PulseIQ CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase4-task17-18-render-security]

permissions:
  contents: read

concurrency:
  group: pulseiq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-phase4.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-phase4.txt

      - name: Compile application and tests
        run: python -m compileall -q explorer tests scripts

      - name: Run test suite
        run: python -m pytest -q

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
